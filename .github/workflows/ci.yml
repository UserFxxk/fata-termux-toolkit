name: Python Unit Tests & AppSec Remediation Suite

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run Python unittest suite (5/5 CLI & OSINT tests)
        run: python3 -m unittest discover -s tests -v

      - name: Verify CLI help & zero-dependency import
        run: python3 recon.py --help

      - name: Run Node.js AppSec Remediation Blueprint Regression Tests (SOLVER-01..08)
        run: node --test examples/express-solver-remediation/solver-security.test.js
